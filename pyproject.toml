[project]
name = "hybridrag"
version = "0.1.0"
description = "Configurable Semantic + Lexical Retrieval-Augmented Generation System"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "streamlit>=1.60.0",
    "langchain==0.3.13",
    "langchain-core==0.3.29",
    "langchain-community==0.3.13",
    "faiss-cpu==1.9.0",
    "sentence-transformers==3.3.1",
    "pypdf==5.1.0",
    "langchain-groq==0.2.3",
]

[tool.uv]
package = false

[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
